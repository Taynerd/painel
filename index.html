<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Painel de Produtividade</title>

    <style>
      /* =====================================================
   RESET
===================================================== */

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        min-height: 100%;

        background: #09090d;

        color: #ffffff;

        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        overflow-x: hidden;
      }

      /* =====================================================
   MODO RELÓGIO EM TELA CHEIA
===================================================== */

      #clock-fullscreen {
        display: none;

        position: fixed;

        top: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        z-index: 99999;

        background: #09090d;

        align-items: center;
        justify-content: center;

        cursor: pointer;

        -webkit-user-select: none;
        user-select: none;
      }

      #fullscreen-time {
        font-size: 18vw;

        font-weight: bold;

        letter-spacing: 4px;

        color: #ffffff;

        line-height: 1;

        text-align: center;

        white-space: nowrap;
      }

      /* Tablet 1024x600 */

      @media screen and (min-width: 900px) {
        #fullscreen-time {
          font-size: 250px;
        }
      }

      /* Telas menores */

      @media screen and (max-width: 700px) {
        #fullscreen-time {
          font-size: 15vw;
        }
      }

      /* =====================================================
   APP
===================================================== */

      .app {
        width: 100%;

        min-height: 100vh;

        background: linear-gradient(
          135deg,
          #09090d 0%,
          #111019 50%,
          #09090d 100%
        );
      }

      /* =====================================================
   CABEÇALHO
===================================================== */

      .header {
        position: relative;

        height: 200px;

        padding: 280px 40px 40px 40px;

        background: #101017;

        border-bottom: 1px solid #292431;

        display: table;

        width: 100%;

        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.35);
      }

      .header:before {
        content: "";

        position: absolute;

        top: 0;
        left: 40px;

        width: 70px;
        height: 3px;

        background: #7b4fc2;
      }

      /* =====================================================
   DATA
===================================================== */

      .date-area {
        display: table-cell;

        vertical-align: middle;

        width: 60%;
      }

      #day-name {
        font-size: 34px;

        font-weight: bold;

        letter-spacing: 3px;

        color: #f1eef5;
      }

      #full-date {
        margin-top: 12px;

        font-size: 21px;

        letter-spacing: 3px;

        color: #ffffff;
      }

      /* =====================================================
   RELÓGIO
===================================================== */

      .clock {
        display: table-cell;

        vertical-align: middle;

        text-align: right;

        font-size: 90px;

        line-height: 1;

        font-weight: bold;

        letter-spacing: 3px;

        color: #ffffff;

        text-shadow: 0 0 20px rgba(123, 79, 194, 0.18);
      }

      /* =====================================================
   CONTEÚDO
===================================================== */

      .content {
        width: 100%;

        padding: 20px 30px;
      }

      /* =====================================================
   CARD
===================================================== */

      .card {
        position: relative;

        background: #15151d;

        border: 1px solid #292532;

        box-shadow: 0 7px 25px rgba(0, 0, 0, 0.25);
      }

      .card:before {
        content: "";

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 2px;

        background: #332d40;
      }

      /* =====================================================
   TÍTULOS
===================================================== */

      .card-title {
        height: 35px;

        font-size: 18px;

        font-weight: bold;

        letter-spacing: 2px;

        color: #eeeeee;
      }

      /* =====================================================
   COMPROMISSOS
===================================================== */

      .commitments-card {
        width: 100%;

        padding: 25px;

        min-height: 260px;

        margin-bottom: 15px;
      }

      .add-task {
        display: table;

        width: 100%;

        margin-bottom: 12px;
      }

      .add-task input {
        display: table-cell;

        width: 90%;

        height: 42px;

        padding: 0 14px;

        background: #0d0d13;

        border: 1px solid #302b38;

        color: #ffffff;

        font-size: 18px;

        outline: none;
      }

      .add-task input:focus {
        border-color: #7650b5;
      }

      .add-task input::placeholder {
        color: #a49eaf;
      }

      .add-task button {
        display: table-cell;

        width: 10%;

        height: 42px;

        border: 1px solid #7650b5;

        background: #6945a6;

        color: #ffffff;

        font-size: 24px;

        cursor: pointer;
      }

      .add-task button:active {
        background: #4e337c;
      }

      /* =====================================================
   LISTA
===================================================== */

      .task-list {
        width: 100%;

        max-height: 125px;

        overflow-y: auto;
      }

      .task {
        position: relative;

        min-height: 39px;

        margin-bottom: 6px;

        padding: 11px 45px 11px 38px;

        background: #1c1b24;

        border: 1px solid #282530;

        color: #fdfdff;

        font-size: 26px;

        cursor: pointer;
      }

      .task:before {
        content: "";

        position: absolute;

        left: 0;
        top: 0;

        width: 2px;
        height: 100%;

        background: #553c79;
      }

      .task-checkbox {
        position: absolute;

        left: 12px;
        top: 11px;

        width: 15px;
        height: 15px;

        border: 1px solid #fdfdfd;
      }

      .task.completed {
        color: #d2cdda;

        text-decoration: line-through;
      }

      .task.completed .task-checkbox {
        background: #7950b5;

        border-color: #7950b5;
      }

      .delete-task {
        position: absolute;

        right: 10px;
        top: 7px;

        width: 25px;
        height: 25px;

        border: none;

        background: transparent;

        color: #e4e1e9;

        font-size: 18px;

        cursor: pointer;
      }

      /* =====================================================
   FERRAMENTAS
===================================================== */

      .tools {
        display: flex;
        width: 100%;
        margin-bottom: 15px;
      }

      .tool-card {
        display: flex;
        flex-direction: column;
        width: 50%;
        height: 500px;
        padding: 25px;
        justify-self: center;
        align-self: center;
        text-align: center;
        background: #15151d;

        border: 1px solid #292532;
      }

      .tool-card + .tool-card {
        border-left: none;
      }

      .tool-title {
        text-align: left;
         padding-bottom: 100px;

        height: 30px;

        font-size: 18px;

        font-weight: bold;

        letter-spacing: 2px;

        color: #d3d3d3;
      }

      /* =====================================================
   TEMPOS
===================================================== */

      .big-time {
        margin-top: 22px;

        font-size: 70px;

        font-weight: bold;

        letter-spacing: 3px;

        color: #f4f2f7;

      }

      .buttons {
        margin-top: 22px;

        text-align: center;
      }

      .button {
        min-width: 110px;

        height: 42px;

        margin: 3px;

        padding: 0 12px;

        background: #211f28;

        border: 1px solid #393442;

        color: #c1bdc8;

        font-size: 10px;

        font-weight: bold;

        letter-spacing: 1px;

        cursor: pointer;
      }

      .button:active {
        background: #332e3d;

        color: #ffffff;
      }

      .button.primary {
        background: #6945a6;

        border-color: #7951b7;

        color: #ffffff;
      }

      /* =====================================================
   TEMPOS PREDEFINIDOS
===================================================== */

      .preset-times {
        padding-top: 20px;

        text-align: center;

        white-space: nowrap;
      }

      .preset-button {
        height: 30px;

        min-width: 65px;

        margin: 2px;

        padding: 0 8px;

        background: #1c1a22;

        border: 1px solid #393442;

        color: #817b8b;

        font-size: 10px;

        font-weight: bold;
        font-weight: 600;

        letter-spacing: 0.5px;

        cursor: pointer;
      }

      .preset-button:active {
        background: #332c40;
      }

      /* Tempo selecionado */

      .preset-button.active {
        background: #6945a6;

        border-color: #8058bc;

        color: #ffffff;
      }

      .countdown-input {
        display: table;

        width: 100%;

        margin-top: 3px;

        text-align: center;
      }

      .countdown-input > div,
      .countdown-input > span {
        display: table-cell;

        vertical-align: bottom;
      }

      .countdown-input label {
        display: block;

        margin-bottom: 4px;

        color: #625e6c;

        font-size: 8px;

        letter-spacing: 1px;
      }

      .countdown-input input {
        width: 65px;

        height: 33px;

        background: #0d0d13;

        border: 1px solid #302c38;

        color: #ffffff;

        text-align: center;

        font-size: 15px;

        outline: none;
      }

      .countdown-input > span {
        width: 15px;

        padding-bottom: 6px;

        color: #77717f;

        font-size: 18px;
      }

      /* =====================================================
   CALENDÁRIO
===================================================== */

      .calendar-card {
        width: 100%;

        padding: 20px;

        margin-bottom: 20px;
      }

      .calendar-header {
        display: table;

        width: 100%;

        height: 35px;
      }

      .calendar-title {
        display: table-cell;

        vertical-align: middle;

        font-size: 18px;

        font-weight: bold;

        letter-spacing: 2px;

        color: #ddd9e2;
      }

      .calendar-controls {
        display: table-cell;

        text-align: right;

        vertical-align: middle;
      }

      .calendar-controls button {
        width: 35px;

        height: 31px;

        margin-left: 4px;

        background: #211f28;

        border: 1px solid #393442;

        color: #bcb6c5;

        font-size: 16px;

        cursor: pointer;
      }

      .calendar-controls button:active {
        background: #6846a4;

        color: #ffffff;
      }

      /* =====================================================
   DIAS DA SEMANA
===================================================== */

      .calendar-week {
        display: table;

        width: 100%;

        table-layout: fixed;

        margin-top: 10px;
      }

      .week-day {
        display: table-cell;

        text-align: center;

        color: #c2bfc7;

        font-size: 12px;

        font-weight: bold;

        letter-spacing: 1px;

        padding: 7px 0;
      }

      /* =====================================================
   GRID CALENDÁRIO
===================================================== */

      .calendar-grid {
        display: table;

        width: 100%;

        table-layout: fixed;
      }

      .calendar-row {
        display: table-row;
      }

      .calendar-day {
        display: table-cell;

        height: 70px;

        text-align: center;

        vertical-align: middle;

        color: #d7d6d8;

        font-size: 18px;
        font-weight: 600;

        border: 1px solid #1f1d25;
      }

      .calendar-day.empty {
        color: transparent;

        background: #111117;
      }

      .calendar-day.today {
        background: #6a46a5;

        color: #ffffff;

        font-weight: bold;

        border-color: #8159be;
      }

      /* =====================================================
   RODAPÉ
===================================================== */

      .footer {
        height: 35px;

        text-align: center;

        padding-top: 8px;

        color: #44404c;

        font-size: 8px;

        letter-spacing: 3px;
      }

      /* =====================================================
   TABLETS
===================================================== */

      @media screen and (max-width: 800px) {
        .header {
          height: 130px;

          padding: 18px 20px;
        }

        .header:before {
          left: 20px;
        }

        #day-name {
          font-size: 20px;
        }

        #full-date {
          font-size: 13px;
        }

        .clock {
          font-size: 48px;
        }

        .content {
          padding: 15px;
        }

        .big-time {
          font-size: 34px;
        }
      }

      /* =====================================================
   RETRATO
===================================================== */

      @media screen and (orientation: portrait) {
        .header {
          height: auto;

          padding: 20px;
        }

        .date-area,
        .clock {
          display: block;

          text-align: center;

          width: 100%;
        }

        .clock {
          margin-top: 15px;

          font-size: 48px;
        }

        .tools {
          display: block;
        }

        .tool-card {
          display: block;

          width: 100%;

          margin-bottom: 15px;

          border-left: 1px solid #292532;
        }

        .calendar-day {
          height: 38px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <!-- =====================================================
     CABEÇALHO
===================================================== -->

      <header class="header">
        <div class="date-area">
          <div id="day-name">SEGUNDA-FEIRA</div>

          <div id="full-date">24 DE AGOSTO DE 2026</div>
        </div>

        <div class="clock" id="clock">00:00</div>

        <!-- MODO RELÓGIO EM TELA CHEIA -->
        <div id="clock-fullscreen">
          <div id="fullscreen-time">00:00:00</div>
        </div>
      </header>

      <div class="content">
        <!-- =====================================================
     COMPROMISSOS
===================================================== -->

        <section class="card commitments-card">
          <div class="card-title">
            COMPROMISSOS

            <span
              id="task-count"
              style="
                float: right;
                background: #211c2b;
                padding: 4px 8px;
                border-radius: 10px;
                color: #a996d8;
                font-size: 10px;
              "
            >
              0
            </span>
          </div>

          <div class="add-task">
            <input
              type="text"
              id="task-input"
              placeholder="Adicionar compromisso..."
              maxlength="80"
            />

            <button id="add-task-button">+</button>
          </div>

          <div id="task-list" class="task-list"></div>
        </section>

        <!-- =====================================================
     CRONÔMETRO + TEMPORIZADOR
===================================================== -->

        <div class="tools">
          <!-- CRONÔMETRO -->

          <section class="tool-card">
            <div class="tool-title">CRONÔMETRO</div>

            <div class="big-time" id="stopwatch">00:00:00</div>

            <div class="buttons">
              <button class="button primary" id="stopwatch-start">
                INICIAR
              </button>

              <button class="button" id="stopwatch-reset">ZERAR</button>
            </div>
          </section>

          <!-- TEMPORIZADOR -->

          <section class="tool-card">
            <div class="tool-title">TEMPORIZADOR</div>

            <div class="big-time" id="countdown">15:00</div>

            <div class="buttons">
              <button class="button primary" id="countdown-start">
                INICIAR
              </button>

              <button class="button" id="countdown-reset">ZERAR</button>
            </div>

            <div class="preset-times">
              <button class="preset-button active" data-minutes="15">
                15 MIN
              </button>

              <button class="preset-button" data-minutes="25">25 MIN</button>

              <button class="preset-button" data-minutes="30">30 MIN</button>

              <button class="preset-button" data-minutes="60">60 MIN</button>
            </div>
          </section>
        </div>

        <!-- =====================================================
     CALENDÁRIO
===================================================== -->

        <section class="card calendar-card">
          <div class="calendar-header">
            <div class="calendar-title" id="calendar-title">AGOSTO 2026</div>

            <div class="calendar-controls">
              <button id="previous-month">‹</button>

              <button id="next-month">›</button>
            </div>
          </div>

          <div class="calendar-week">
            <div class="week-day">DOM</div>
            <div class="week-day">SEG</div>
            <div class="week-day">TER</div>
            <div class="week-day">QUA</div>
            <div class="week-day">QUI</div>
            <div class="week-day">SEX</div>
            <div class="week-day">SÁB</div>
          </div>

          <div class="calendar-grid" id="calendar-grid"></div>
        </section>
      </div>

      <footer class="footer">PAINEL DE PRODUTIVIDADE</footer>
    </div>

    <script>
      /* =====================================================
   DATA E HORA
===================================================== */

      var days = [
        "DOMINGO",
        "SEGUNDA-FEIRA",
        "TERÇA-FEIRA",
        "QUARTA-FEIRA",
        "QUINTA-FEIRA",
        "SEXTA-FEIRA",
        "SÁBADO",
      ];

      var months = [
        "JANEIRO",
        "FEVEREIRO",
        "MARÇO",
        "ABRIL",
        "MAIO",
        "JUNHO",
        "JULHO",
        "AGOSTO",
        "SETEMBRO",
        "OUTUBRO",
        "NOVEMBRO",
        "DEZEMBRO",
      ];

      function updateDateTime() {
        var now = new Date();

        var hours = now.getHours();

        var minutes = now.getMinutes();

        if (hours < 10) {
          hours = "0" + hours;
        }

        if (minutes < 10) {
          minutes = "0" + minutes;
        }

        document.getElementById("clock").innerHTML = hours + ":" + minutes;

        document.getElementById("day-name").innerHTML = days[now.getDay()];

        document.getElementById("full-date").innerHTML =
          now.getDate() +
          " DE " +
          months[now.getMonth()] +
          " DE " +
          now.getFullYear();
      }

      updateDateTime();

      setInterval(updateDateTime, 1000);

      /* =====================================================
   COMPROMISSOS
===================================================== */

      var tasks = [];

      try {
        var saved = localStorage.getItem("tablet_tasks");

        if (saved) {
          tasks = JSON.parse(saved);
        }
      } catch (e) {
        tasks = [];
      }

      function saveTasks() {
        try {
          localStorage.setItem("tablet_tasks", JSON.stringify(tasks));
        } catch (e) {}
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")

          .replace(/</g, "&lt;")

          .replace(/>/g, "&gt;")

          .replace(/"/g, "&quot;")

          .replace(/'/g, "&#039;");
      }

      function renderTasks() {
        var list = document.getElementById("task-list");

        list.innerHTML = "";

        var i;

        for (i = 0; i < tasks.length; i++) {
          var task = tasks[i];

          var div = document.createElement("div");

          div.className = "task";

          if (task.completed) {
            div.className += " completed";
          }

          var checkbox = document.createElement("span");

          checkbox.className = "task-checkbox";

          var text = document.createElement("span");

          text.innerHTML = escapeHtml(task.text);

          var deleteButton = document.createElement("button");

          deleteButton.className = "delete-task";

          deleteButton.innerHTML = "×";

          (function (index) {
            div.onclick = function () {
              tasks[index].completed = !tasks[index].completed;

              saveTasks();

              renderTasks();
            };

            deleteButton.onclick = function (event) {
              if (event) {
                event.cancelBubble = true;
              }

              tasks.splice(index, 1);

              saveTasks();

              renderTasks();
            };
          })(i);

          div.appendChild(checkbox);

          div.appendChild(text);

          div.appendChild(deleteButton);

          list.appendChild(div);
        }

        document.getElementById("task-count").innerHTML = tasks.length;
      }

      function addTask() {
        var input = document.getElementById("task-input");

        var text = input.value.replace(/^\s+|\s+$/g, "");

        if (text === "") {
          return;
        }

        tasks.push({
          text: text,

          completed: false,
        });

        saveTasks();

        renderTasks();

        input.value = "";

        input.focus();
      }

      document.getElementById("add-task-button").onclick = addTask;

      document.getElementById("task-input").onkeypress = function (event) {
        event = event || window.event;

        if (event.keyCode === 13) {
          addTask();
        }
      };

      renderTasks();

      /* =====================================================
   CRONÔMETRO
===================================================== */

      var stopwatchRunning = false;

      var stopwatchSeconds = 0;

      var stopwatchInterval = null;

      function formatStopwatch(seconds) {
        var hours = Math.floor(seconds / 3600);

        var minutes = Math.floor((seconds % 3600) / 60);

        var secs = seconds % 60;

        if (hours < 10) {
          hours = "0" + hours;
        }

        if (minutes < 10) {
          minutes = "0" + minutes;
        }

        if (secs < 10) {
          secs = "0" + secs;
        }

        return hours + ":" + minutes + ":" + secs;
      }

      function updateStopwatch() {
        document.getElementById("stopwatch").innerHTML =
          formatStopwatch(stopwatchSeconds);
      }

      function startStopwatch() {
        if (stopwatchRunning) {
          stopwatchRunning = false;

          clearInterval(stopwatchInterval);

          document.getElementById("stopwatch-start").innerHTML = "CONTINUAR";

          return;
        }

        stopwatchRunning = true;

        document.getElementById("stopwatch-start").innerHTML = "PAUSAR";

        stopwatchInterval = setInterval(
          function () {
            stopwatchSeconds++;

            updateStopwatch();
          },

          1000,
        );
      }

      function resetStopwatch() {
        stopwatchRunning = false;

        clearInterval(stopwatchInterval);

        stopwatchSeconds = 0;

        updateStopwatch();

        document.getElementById("stopwatch-start").innerHTML = "INICIAR";
      }

      document.getElementById("stopwatch-start").onclick = startStopwatch;

      document.getElementById("stopwatch-reset").onclick = resetStopwatch;

      /* =====================================================
   TEMPORIZADOR
===================================================== */

      var countdownRunning = false;

      /* 15 minutos é o preset inicial */
      var selectedPresetMinutes = 15;

      var countdownSeconds = 15 * 60;

      var countdownInterval = null;

      /* =====================================================
   FORMATAR TEMPO
===================================================== */

      function formatCountdown(seconds) {
        var minutes = Math.floor(seconds / 60);

        var secs = seconds % 60;

        if (minutes < 10) {
          minutes = "0" + minutes;
        }

        if (secs < 10) {
          secs = "0" + secs;
        }

        return minutes + ":" + secs;
      }

      /* =====================================================
   ATUALIZAR DISPLAY
===================================================== */

      function updateCountdown() {
        document.getElementById("countdown").innerHTML =
          formatCountdown(countdownSeconds);
      }

      /* =====================================================
   INICIAR / PAUSAR
===================================================== */

      function startCountdown() {
        /* Se estiver rodando, pausa */

        if (countdownRunning) {
          countdownRunning = false;

          clearInterval(countdownInterval);

          document.getElementById("countdown-start").innerHTML = "CONTINUAR";

          return;
        }

        /* Não inicia se estiver em zero */

        if (countdownSeconds <= 0) {
          countdownSeconds = selectedPresetMinutes * 60;

          updateCountdown();
        }

        countdownRunning = true;

        document.getElementById("countdown-start").innerHTML = "PAUSAR";

        countdownInterval = setInterval(function () {
          countdownSeconds--;

          updateCountdown();

          /* Terminou */

          if (countdownSeconds <= 0) {
            finishCountdown();
          }
        }, 1000);
      }

      /* =====================================================
   FINALIZAR
===================================================== */

      function finishCountdown() {
        countdownRunning = false;

        clearInterval(countdownInterval);

        countdownSeconds = 0;

        updateCountdown();

        document.getElementById("countdown-start").innerHTML = "INICIAR";

        /* Vibração */

        try {
          if (navigator.vibrate) {
            navigator.vibrate([500, 200, 500, 200, 500]);
          }
        } catch (e) {}
      }

      /* =====================================================
   ZERAR
===================================================== */

      function resetCountdown() {
        /* Para o contador */

        countdownRunning = false;

        clearInterval(countdownInterval);

        /* 
       VOLTA PARA O PRESET ESCOLHIDO
    */

        countdownSeconds = selectedPresetMinutes * 60;

        /* Atualiza imediatamente */

        updateCountdown();

        /* Volta o botão para INICIAR */

        document.getElementById("countdown-start").innerHTML = "INICIAR";
      }

      /* =====================================================
   PRESETS
===================================================== */

      var presetButtons = document.getElementsByClassName("preset-button");

      for (var i = 0; i < presetButtons.length; i++) {
        presetButtons[i].onclick = function () {
          /* Não deixa trocar durante a contagem */

          if (countdownRunning) {
            return;
          }

          /* Pega o tempo do botão */

          selectedPresetMinutes = parseInt(
            this.getAttribute("data-minutes"),
            10,
          );

          /* Define o novo tempo */

          countdownSeconds = selectedPresetMinutes * 60;

          /* Remove seleção dos outros */

          for (var j = 0; j < presetButtons.length; j++) {
            presetButtons[j].className = "preset-button";
          }

          /* Marca o selecionado */

          this.className = "preset-button active";

          /* Atualiza o relógio */

          updateCountdown();
        };
      }

      /* =====================================================
   BOTÕES
===================================================== */

      document.getElementById("countdown-start").onclick = startCountdown;

      document.getElementById("countdown-reset").onclick = resetCountdown;

      /* =====================================================
   INICIALIZAÇÃO
===================================================== */

      updateCountdown();

      /* =====================================================
   CALENDÁRIO
===================================================== */

      var calendarDate = new Date();

      var calendarMonth = calendarDate.getMonth();

      var calendarYear = calendarDate.getFullYear();

      function renderCalendar() {
        var grid = document.getElementById("calendar-grid");

        grid.innerHTML = "";

        var title = document.getElementById("calendar-title");

        title.innerHTML = months[calendarMonth] + " " + calendarYear;

        var firstDay = new Date(calendarYear, calendarMonth, 1).getDay();

        var totalDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();

        var day = 1;

        var row;

        for (row = 0; row < 6; row++) {
          var rowElement = document.createElement("div");

          rowElement.className = "calendar-row";

          var column;

          for (column = 0; column < 7; column++) {
            var cell = document.createElement("div");

            cell.className = "calendar-day";

            if (row === 0 && column < firstDay) {
              cell.innerHTML = " ";

              cell.className += " empty";
            } else if (day > totalDays) {
              cell.innerHTML = " ";

              cell.className += " empty";
            } else {
              cell.innerHTML = day;

              var today = new Date();

              if (
                day === today.getDate() &&
                calendarMonth === today.getMonth() &&
                calendarYear === today.getFullYear()
              ) {
                cell.className += " today";
              }

              day++;
            }

            rowElement.appendChild(cell);
          }

          grid.appendChild(rowElement);

          if (day > totalDays) {
            break;
          }
        }
      }

      document.getElementById("previous-month").onclick = function () {
        calendarMonth--;

        if (calendarMonth < 0) {
          calendarMonth = 11;

          calendarYear--;
        }

        renderCalendar();
      };

      document.getElementById("next-month").onclick = function () {
        calendarMonth++;

        if (calendarMonth > 11) {
          calendarMonth = 0;

          calendarYear++;
        }

        renderCalendar();
      };
      /* =====================================================
   MODO RELÓGIO EM TELA CHEIA
===================================================== */

      var clockElement = document.getElementById("clock");

      var fullscreenClock = document.getElementById("clock-fullscreen");

      var fullscreenTime = document.getElementById("fullscreen-time");

      /*
   Abre o modo tela cheia
*/

      function openFullscreenClock() {
        fullscreenClock.style.display = "flex";

        updateFullscreenClock();
      }

      /*
   Fecha o modo tela cheia
*/

      function closeFullscreenClock() {
        fullscreenClock.style.display = "none";
      }

      /*
   Atualiza o relógio com segundos
*/

      function updateFullscreenClock() {
        var now = new Date();

        var hours = now.getHours();

        var minutes = now.getMinutes();

        var seconds = now.getSeconds();

        if (hours < 10) {
          hours = "0" + hours;
        }

        if (minutes < 10) {
          minutes = "0" + minutes;
        }

        if (seconds < 10) {
          seconds = "0" + seconds;
        }

        fullscreenTime.innerHTML = hours + ":" + minutes + ":" + seconds;
      }

      /*
   Clique no relógio normal
*/

      clockElement.onclick = function (event) {
        if (event) {
          event.stopPropagation();
        }

        openFullscreenClock();
      };

      /*
   Qualquer toque na tela cheia
   fecha o modo relógio
*/

      fullscreenClock.onclick = function () {
        closeFullscreenClock();
      };

      /*
   Atualização dos segundos
*/

      setInterval(
        function () {
          updateFullscreenClock();
        },

        1000,
      );

      renderCalendar();
    </script>
  </body>
</html>
